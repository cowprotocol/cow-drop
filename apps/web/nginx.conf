server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every path that is not a real file resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rewritten on every container start, so it must never be cached — a stale copy would point the
    # page at the previous deployment's keeper.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Vite fingerprints these, so they are safe to cache forever. index.html is not fingerprinted and
    # keeps nginx's default (no explicit expiry), which is what lets a deploy be picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
