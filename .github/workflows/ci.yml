name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # cow-shed carries its own submodules (forge-std, solady, openzeppelin).
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge fmt
        working-directory: contracts
        run: forge fmt --check

      # The fork tests skip themselves without GNOSIS_RPC_URL, so this is the hermetic suite.
      - name: forge test
        working-directory: contracts
        run: forge test -vv

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `src/generated/` is built from the foundry artifacts and the deployment records, so the build
      # has to happen before the SDK can be generated.
      - name: forge build
        working-directory: contracts
        run: forge build

      - name: regenerate constants
        run: pnpm --filter @cowprotocol/cow-drop-sdk generate

      # The one check that actually matters here. Every address in `src/generated/` feeds the CREATE2
      # preimage of every drop, so a stale committed copy means the SDK quotes addresses the contracts
      # will never deploy to — and a drop address that is wrong by one byte is money sent nowhere.
      # Nothing but this stops someone changing a contract and forgetting `pnpm generate`.
      - name: generated constants are up to date
        run: git diff --exit-code -- packages/sdk/src/generated/

      - name: build and test the sdk
        run: |
          pnpm --filter @cowprotocol/cow-drop-sdk build
          pnpm --filter @cowprotocol/cow-drop-sdk test

      # The SDK's derivation is checked against fixtures generated by the compiled contract. Two
      # implementations of one formula drift silently, and the failure mode is a stranded address — so
      # the fixtures must also still match what the contract produces today.
      - name: derivation fixtures are up to date
        working-directory: contracts
        run: |
          forge script script/Fixtures.s.sol
          git diff --exit-code -- deployments/derivation-fixtures.json

      # Depends on the SDK's `dist/`, built above — it decodes `OrderPlacement` against the ABI the
      # generate step produced, so a change to the event surfaces here as a failing decode.
      - name: build and test the watch tower
        run: |
          pnpm --filter @cowprotocol/cow-drop-watch-tower build
          pnpm --filter @cowprotocol/cow-drop-watch-tower test

      # Depends on both the SDK's and the watch tower's `dist/` — it composes the latter as a library.
      - name: build and test the keeper
        run: |
          pnpm --filter @cowprotocol/cow-drop-keeper build
          pnpm --filter @cowprotocol/cow-drop-keeper test

      - name: typecheck and build the web app
        run: pnpm --filter @cowprotocol/cow-drop-web build
